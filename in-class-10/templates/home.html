<!doctype html>
<html lang="en">
<head><title>Book search</title></head>
<body>
  <h1>Book search</h1>
  {% if message %}
  <p class="message">{{ message }}</p>
  {% endif %}
  <form action="/results" method="get">
    <label for="author">Author</label>
    <input id="author" name="author_search">
    <button type="submit">Find books</button>
  </form>
</body>
</html>
